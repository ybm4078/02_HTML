<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/6fda4bf8e6.js" crossorigin="anonymous"></script>
</head>
<body>
<aside>
    <div class="logo">
        <i class="fa-solid fa-cube brand-icon"></i>
        <span>MyDash</span>
    </div>
    <nav>
        <ul>
            <li>
                <i class="fa-regular fa-id-badge"></i>
                <span>Profile Info</span>
            </li>
            <li>
                <i class="fa-solid fa-shield-halved"></i>
                <span>Account Security</span>
            </li>
            <li>
                <i class="fa-regular fa-bell"></i>
                <span>Notifications</span>
            </li>
            <li>
                <i class="fa-solid fa-credit-card"></i>
                <span>Billing Details</span>
            </li>
        </ul>
    </nav>
</aside>
<main>
    <header>
        <div class="header-text">
            <h2>Profile Information</h2>
            <span>Update your photo and personal details.</span>
        </div>
        <div class="user-shortcut">
            <i class="fa-solid fa-magnifying-glass"></i>
            <div class="user-avatar-small">A</div>
        </div>
    </header>
    <div class="content-wrapper">
        <div class="m1">
            <div class="c1">
                <div class="user-avatar-big">A</div>
                <button class="b1 but">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Upload</span>
                </button>
                <button class="b2 but">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Remove</span>
                </button>
            </div>
            <div class="c2">
                <div class="d1">
                    <label>First Name</label>
                    <input type="text" class="i1" placeholder="양">
                </div>
                <div class="d1">
                    <label>Last Name</label>
                    <input type="text" class="i1" placeholder="범모">
                </div>
            </div>
            <div class="c3">
                <div class="d2">
                    <label>Email</label>
                    <input type="email" class="i1" placeholder="ybm4078@naver.com">
                </div>
            </div>
            <div class="c4">
                <div class="d2">
                    <label>Phone Nuber</label>
                    <input type="number" class="i1" placeholder="010-8007-4078">
                </div>
            </div>
            <div class="c5">
                Receive updates and newsletters via email
            </div>
            <div class="c6">
                <button class="b3 but">Cancel</button>
                <button class="b4 but">Save Changes</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
