<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container flex-row">
        <!-- 좌측 -->
        <section class="info-section flex-col">
            <div class="product-header flex-row">
                <div class="logo">SNKRS.</div>
                <nav class="flex-row top-nav">
                    <span>Men</span>
                    <span class="active">Women</span>
                    <span>kids</span>
                </nav>
            </div>
            <div class="flex-col product-detail">
                <span class="badge">Limited Edition</span>
                <h1 class="title">
                    AIR MAX <br />
                    <span class="highlight">PULSE</span>
                </h1>
                <p class="desc">Pushing the limits of what's possible</p>
            </div>
            <div class="flex-col size-selector">
                <span class="size-lable">Select Size (US)</span>
                <div class="flex-row sizes">
                    <div class="flex-center size-box">7</div>
                    <div class="flex-center size-box">8</div>
                    <div class="flex-center size-box size-active">9</div>
                    <div class="flex-center size-box">10</div>
                    <div class="flex-center size-box">11</div>
                </div>
            </div>
            <div class="flex-row action-row">
                <span class="price">$ 185.00</span>
                <button class="buy-btn">Add to Bag</button>
            </div>
        </section>

        <!-- 우측 -->
        <section class="visual-section flex-col">
            <div></div>
            <div class="flex-center img-container">
                <div class="shoe-img"></div>
            </div>
            <div class="flex-row features">
                <div class="flex-col feature-itme">
                    <span class="f-value">270도</span>
                    <span class="f-key">Air Unut</span>
                </div>
                <div class="flex-col feature-itme">
                    <span class="f-value">12oz</span>
                    <span class="f-key">LightWeght</span>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
