<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>head 태그 연습</title>
    <style> p { color: darkmagenta; }  /* 이 문서에 있는 모든 p 태그에 적용 */
    h1 { color: tomato; }</style>
    <link rel="stylesheet" href="stlye.css">
</head>
<body>
<h1>이 제목은 style.css에서 토마토 색상으로 변경했습니다</h1>
<p>이 문단은 style.css 태그로 회색으로 변경 했습니다</p>

<!-- 태그에 직접 style 속성으로 부여하는 방법 -->
<span style="color: aqua">이 문장은 style 속성으로 aque 색으로 변경 했습니다.</span>
</body>
</html>
