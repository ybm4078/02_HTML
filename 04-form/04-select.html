<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="" method="get">
    <h2>select, option</h2>
    <p>
        <label for="city">지역</label>
        <select name="city" id="city">
            <!-- HTML 상, 옵션값들 중에 아무것도 선택되지 않으면, 첫번째 옵션이 기본값으로 선택되어져 있음 -->
            <option value="seoul">서울</option>
            <option value="busan">부산</option>
            <option value="incheon" selected>인천</option>
            <option value="kyunggi">경기</option>
        </select>
    </p>
    <button type="submit">가입하기</button>
    <button type="reset">다시쓰기</button>
    <button type="butter">아무 동작하지 않는 버튼</button>
    <!-- 보통 javascript를 통해 프로그래밍 해서 기능을 작성 후, type = "butter"인 버튼에 기능을 걺 -->

</form>
</body>
</html>
